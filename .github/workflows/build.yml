name: BigRocket CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # The hosted runner's preinstalled Android SDK does not reliably include
      # very recent platforms/build-tools (compileSdk 35 here), and their
      # licenses are not pre-accepted. Without this step, "./gradlew assembleDebug"
      # fails with "You have not accepted the license agreements..." and no APK
      # is ever produced.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google removed the deprecated 'tools' package from the SDK repo
          # index (2026-09-15); the action's default `packages` input still
          # requests it, so the step fails before anything else runs. We only
          # ever used this step for cmdline-tools/platform-tools anyway —
          # platforms/build-tools/ndk are installed explicitly below.
          packages: "platform-tools"

      - name: Install required SDK platform & build-tools
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;26.3.11579264"
          yes | sdkmanager --licenses || true

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Rust toolchain and Android targets
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Prepare Aether native sources
        run: |
          chmod +x scripts/fetch-natives.sh scripts/build-natives.sh scripts/build-xray.sh
          scripts/fetch-natives.sh

      - name: Build Aether native cores
        env:
          ANDROID_API: 26
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: scripts/build-natives.sh all

      - name: Set up Go (Xray core)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build Xray core
        env:
          ANDROID_API: 26
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: scripts/build-xray.sh

      # The psiphon console client is a GOOS=android PIE (Android refuses to
      # start a non-PIE executable, silently), which needs cgo and therefore
      # the NDK's clang - see native/aether/psiphon-build.sh.
      - name: Build psiphon console client
        env:
          ANDROID_API: 26
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: |
          chmod +x scripts/build-psiphon.sh
          scripts/build-psiphon.sh

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BigRocket-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Release: signed, per-ABI APKs published as a GitHub release.
  #
  # Only the two ABIs the native cores are built for (arm64-v8a and
  # armeabi-v7a - see scripts/build-natives.sh, build-xray.sh and
  # build-psiphon.sh). The splits block in app/build.gradle.kts is what turns
  # assembleRelease into two APKs, and it is enabled with -PabiSplits so this
  # job is the only build that produces them.
  # ---------------------------------------------------------------------------
  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install required SDK platform & build-tools
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;26.3.11579264"
          yes | sdkmanager --licenses || true

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Rust toolchain and Android targets
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Prepare Aether native sources
        run: |
          chmod +x scripts/fetch-natives.sh scripts/build-natives.sh scripts/build-xray.sh
          scripts/fetch-natives.sh

      - name: Build Aether native cores
        env:
          ANDROID_API: 26
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: scripts/build-natives.sh all

      - name: Set up Go (Xray core, psiphon console client)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build Xray core
        env:
          ANDROID_API: 26
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: scripts/build-xray.sh

      # Same as the build job: GOOS=android PIE, so the NDK clang is required.
      - name: Build psiphon console client
        env:
          ANDROID_API: 26
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: |
          chmod +x scripts/build-psiphon.sh
          scripts/build-psiphon.sh

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Assemble release APKs (per ABI)
        run: ./gradlew assembleRelease -PabiSplits --stacktrace --no-daemon

      # A throwaway key, generated per run: these are CI artifacts of a public
      # repository, not a distribution identity. Swap this for a real signing
      # key (keystore in secrets) before shipping to a store.
      - name: Create release keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/bigrocket.jks" \
            -alias bigrocket \
            -storetype PKCS12 \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass bigrocket -keypass bigrocket \
            -dname "CN=BigRocket CI, O=BigRocket, C=BE"

      - name: Sign release APKs
        env:
          BUILD_TOOLS: ${{ env.ANDROID_SDK_ROOT }}/build-tools/37.0.0
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signed"
          for abi in arm64-v8a armeabi-v7a; do
            unsigned="app/build/outputs/apk/release/app-${abi}-release-unsigned.apk"
            if [ ! -f "$unsigned" ]; then
              # The per-ABI split did not produce this file (a future AGP that
              # dropped the splits block would do that): the universal release
              # APK carries both cores, so it is a correct - if larger - fallback.
              echo "NOTE: no per-ABI APK for $abi, falling back to the universal release APK"
              unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
            fi
            aligned="$RUNNER_TEMP/signed/app-${abi}-aligned.apk"
            signed="$RUNNER_TEMP/signed/BigRocket-${abi}-release.apk"
            "$BUILD_TOOLS/zipalign" -f -p 4 "$unsigned" "$aligned"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$RUNNER_TEMP/bigrocket.jks" \
              --ks-key-alias bigrocket \
              --ks-pass pass:bigrocket \
              --key-pass pass:bigrocket \
              --out "$signed" "$aligned"
            "$BUILD_TOOLS/apksigner" verify --print-certs "$signed"
          done
          ls -l "$RUNNER_TEMP/signed"

      - name: Upload signed release APKs
        uses: actions/upload-artifact@v4
        with:
          name: BigRocket-release-apks
          path: ${{ runner.temp }}/signed/BigRocket-*-release.apk
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-psiphon.${{ github.run_number }}
          name: BigRocket Direct + Aether + Psiphon (build ${{ github.run_number }})
          body: |
            Release build of BigRocket with the **Direct + Aether + Psiphon** mode:
            TUN traffic goes to the psiphon-tunnel-core client the Aether engine
            spawns, whose own servers are dialled through Aether's tunnel, which
            rides on the bonding boundary.

            Per-ABI APKs (the only two the native cores are built for):
            - `BigRocket-arm64-v8a-release.apk` - 64-bit ARM devices
            - `BigRocket-armeabi-v7a-release.apk` - 32-bit ARM devices

            Signed with a CI-generated key (see the workflow).
          files: ${{ runner.temp }}/signed/BigRocket-*-release.apk
          make_latest: true
